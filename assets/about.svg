<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="sheet-title sheet-desc">
<title id="sheet-title">About Pavan Mallesh Vinjamuri</title>
<desc id="sheet-desc">Aspiring data analyst with hands-on experience in SQL, Python, Power BI, Tableau and Excel. Education: B.Tech CSE in Data Science at St. Ann's College of Engineering and Technology, graduating 2026, CGPA 8.2. Based in Hyderabad, open to analyst roles.</desc>
<style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif; }
    .nums { font-variant-numeric: tabular-nums; }
    .rise { animation: rise 0.8s cubic-bezier(.16,1,.3,1) both; }
    .d1 { animation-delay: 0.08s; } .d2 { animation-delay: 0.16s; }
    .d3 { animation-delay: 0.24s; } .d4 { animation-delay: 0.32s; }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) {
      .rise, .pulse { animation: none !important; opacity: 1 !important; transform: none !important; }
      .scan { display: none !important; }
    }
  </style>
<rect width="1200" height="480" fill="#0A1B2E"/>

