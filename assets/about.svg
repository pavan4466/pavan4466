  <text x="64" y="74" font-size="34" font-weight="700" fill="#E8E2D4" text-anchor="start">I like the messy part:</text>
  <text x="64" y="114" font-size="34" font-weight="700" fill="#E8E2D4" text-anchor="start">cleaning until the pattern shows.</text>
</g>
<g class="rise d1">
  <text x="64" y="170" font-size="19" font-weight="400" fill="#E8E2D4" text-anchor="start">I am an aspiring Data Analyst with hands-on experience in SQL,</text>
<text x="64" y="200" font-size="19" font-weight="400" fill="#E8E2D4" text-anchor="start">Python, Power BI, Tableau, and Excel. I enjoy cleaning messy</text>
<text x="64" y="230" font-size="19" font-weight="400" fill="#E8E2D4" text-anchor="start">datasets, analyzing patterns, and building dashboards that turn raw</text>
<text x="64" y="260" font-size="19" font-weight="400" fill="#E8E2D4" text-anchor="start">data into clear, actionable business insights.</text>
</g>
<g class="rise d2">
  <text x="64" y="292" font-size="19" font-weight="400" fill="#E8E2D4" text-anchor="start">My work spans exploratory data analysis, KPI reporting, dashboard</text>
<text x="64" y="322" font-size="19" font-weight="400" fill="#E8E2D4" text-anchor="start">development, and SQL-based analysis across pricing, sales, and</text>
<text x="64" y="352" font-size="19" font-weight="400" fill="#E8E2D4" text-anchor="start">energy datasets. I am open to Data Analyst, BI Analyst, Reporting</text>
<text x="64" y="382" font-size="19" font-weight="400" fill="#E8E2D4" text-anchor="start">Analyst, MIS Analyst, and Business Analyst opportunities.</text>
</g>
