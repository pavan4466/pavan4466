<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-labelledby="sheet-title sheet-desc">
<title id="sheet-title">Pavan Mallesh Vinjamuri — end of profile blueprint</title>
<desc id="sheet-desc">Vinjamuri Pavan Mallesh, data analyst, Hyderabad, 2026. Raw data in, clear decisions out. End of profile blueprint.</desc>
<style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif; }
    .nums { font-variant-numeric: tabular-nums; }
    .rise { animation: rise 0.8s cubic-bezier(.16,1,.3,1) both; }
    .d1 { animation-delay: 0.08s; } .d2 { animation-delay: 0.16s; }
    .d3 { animation-delay: 0.24s; } .d4 { animation-delay: 0.32s; }
    .d5 { animation-delay: 0.40s; } .d6 { animation-delay: 0.48s; }
    .pulse { animation: pulse 2s cubic-bezier(.16,1,.3,1) infinite; }
    .draw { animation: draw 1.2s cubic-bezier(.16,1,.3,1) both; }
    .slide { animation: slide 0.6s cubic-bezier(.16,1,.3,1) both; }
    .grow { animation: grow 1s cubic-bezier(.16,1,.3,1) both; }
    .countup { animation: countUp 1.5s cubic-bezier(.16,1,.3,1) both; }
    .shimmer { animation: shimmer 3s linear infinite; }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes grow { from { transform: scaleX(0); transform-origin: left; } to { transform: scaleX(1); transform-origin: left; } }
    @keyframes countUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .rise, .pulse, .draw, .slide, .grow, .countup, .shimmer {
        animation: none !important; opacity: 1 !important; transform: none !important;
      }
      .scan { display: none !important; }
    }
  </style>
<rect width="1200" height="240" fill="#0A1B2E"/>

<line x1="64" y1="40" x2="1136" y2="40" stroke="#E8E2D4" stroke-opacity="0.3" stroke-width="1"/>
<g class="rise">
  <text x="64" y="112" font-size="44" font-weight="700" fill="#E8E2D4" text-anchor="start" letter-spacing="-1.2">VINJAMURI PAVAN MALLESH</text>
  <text x="64" y="152" font-size="22" font-weight="400" fill="#9FB0BE" text-anchor="start">Raw data in. Clear decisions out.</text>
</g>
<text x="1136" y="76" font-size="11.5" font-weight="400" fill="#9FB0BE" text-anchor="end" letter-spacing="1">HYDERABAD, INDIA</text>
<text x="1136" y="98" font-size="11.5" font-weight="400" fill="#9FB0BE" text-anchor="end" letter-spacing="1">2026</text>
<line x1="64" y1="190" x2="1136" y2="190" stroke="#E8E2D4" stroke-opacity="0.16" stroke-width="1"/>
<text x="64" y="216" font-size="11.5" font-weight="400" fill="#9FB0BE" text-anchor="start" letter-spacing="0.8">PROFILE BLUEPRINT / 07 SECTIONS / SVG + LIVE GITHUB DATA</text>
<text x="1136" y="216" font-size="11.5" font-weight="400" fill="#9FB0BE" text-anchor="end" letter-spacing="0.8">END OF SET</text>

</svg>
