<title id="sheet-title">RetailPulse Analytics — project 04</title>
<desc id="sheet-desc">RetailPulse Analytics. Simulate an end-to-end sales and inventory analytics workflow. Designed as a multi-region analytics case study. Covers cleaning, SQL analysis, and Power BI reporting. Currently in progress as a portfolio-strengthening project. Stack: SQL, Python, Power BI, Excel.</desc>
