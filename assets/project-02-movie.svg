<title id="sheet-title">Movie Sales Dashboard — project 02</title>
<desc id="sheet-desc">Movie Sales Dashboard. Compare genre performance across revenue, ratings, and audience votes. Cleaned and modeled the dataset in Power Query. Built KPI-driven dashboards with DAX measures. Compared genre leaders across three different outcomes. Stack: Power BI, Power Query, DAX, Data modeling.</desc>
