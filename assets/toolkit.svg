  <text x="248" y="318" font-size="20" font-weight="600" fill="#E8E2D4" text-anchor="start" class="slide">pandas / NumPy / Matplotlib</text>
<text x="248" y="344" font-size="20" font-weight="600" fill="#E8E2D4" text-anchor="start" class="slide">Seaborn / BeautifulSoup</text>
  <text x="680" y="318" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start" class="slide">Cleaning, preprocessing, EDA, scraping, and charts for</text>
<text x="680" y="339" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start" class="slide">analysis.</text>
