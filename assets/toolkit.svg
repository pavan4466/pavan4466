<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="sheet-title sheet-desc">
<title id="sheet-title">Toolkit — SQL, Power BI, Python, Tableau</title>
<desc id="sheet-desc">Toolkit groups: Query, with SQL and MySQL for joins and aggregations; BI, with Power BI, Tableau and Excel for KPI dashboards and reporting; Python, with pandas, NumPy, Matplotlib, Seaborn and BeautifulSoup for cleaning and EDA; Workflow, with ETL, data modeling and KPI reporting.</desc>
<style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif; }
    .nums { font-variant-numeric: tabular-nums; }
    .rise { animation: rise 0.8s cubic-bezier(.16,1,.3,1) both; }
    .d1 { animation-delay: 0.08s; } .d2 { animation-delay: 0.16s; }
    .d3 { animation-delay: 0.24s; } .d4 { animation-delay: 0.32s; }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) {
      .rise, .pulse { animation: none !important; opacity: 1 !important; transform: none !important; }
      .scan { display: none !important; }
    }
  </style>
<rect width="1200" height="520" fill="#0A1B2E"/>

<text x="64" y="64" font-size="19" font-weight="400" fill="#9FB0BE" text-anchor="start">Four groups. One job: make the data explain itself.</text>
<line x1="64" y1="88" x2="1136" y2="88" stroke="#E8E2D4" stroke-opacity="0.16" stroke-width="1"/>
<text x="64" y="124" font-size="11.5" font-weight="400" fill="#9FB0BE" text-anchor="start" letter-spacing="1">GROUP</text>
<text x="248" y="124" font-size="11.5" font-weight="400" fill="#9FB0BE" text-anchor="start" letter-spacing="1">TOOLS</text>
<text x="680" y="124" font-size="11.5" font-weight="400" fill="#9FB0BE" text-anchor="start" letter-spacing="1">WHERE I USE IT</text>
<line x1="216" y1="150" x2="216" y2="438" stroke="#E8E2D4" stroke-opacity="0.16" stroke-width="1"/>
<g class="rise d1">
  <rect x="213" y="152" width="6" height="6" fill="#FF6B35"/>
  <text x="64" y="158" font-size="24" font-weight="700" fill="#E8E2D4" text-anchor="start">Query</text>
  <text x="248" y="158" font-size="20" font-weight="600" fill="#E8E2D4" text-anchor="start">SQL / MySQL</text>
  <text x="680" y="158" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start">Joins, aggregations, subqueries, and per-capita</text>
<text x="680" y="179" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start">analysis across multi-table datasets.</text>
</g>
<g class="rise d2">
  <rect x="213" y="232" width="6" height="6" fill="#FF6B35"/>
  <text x="64" y="238" font-size="24" font-weight="700" fill="#E8E2D4" text-anchor="start">BI</text>
  <text x="248" y="238" font-size="20" font-weight="600" fill="#E8E2D4" text-anchor="start">Power BI / Tableau / Excel</text>
  <text x="680" y="238" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start">KPI dashboards, DAX, Power Query, visual storytelling,</text>
<text x="680" y="259" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start">and reporting support.</text>
</g>
<g class="rise d3">
  <rect x="213" y="312" width="6" height="6" fill="#FF6B35"/>
  <text x="64" y="318" font-size="24" font-weight="700" fill="#E8E2D4" text-anchor="start">Python</text>
  <text x="248" y="318" font-size="20" font-weight="600" fill="#E8E2D4" text-anchor="start">pandas / NumPy / Matplotlib</text>
<text x="248" y="344" font-size="20" font-weight="600" fill="#E8E2D4" text-anchor="start">Seaborn / BeautifulSoup</text>
  <text x="680" y="318" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start">Cleaning, preprocessing, EDA, scraping, and charts for</text>
<text x="680" y="339" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start">analysis.</text>
</g>
<g class="rise d4">
  <rect x="213" y="392" width="6" height="6" fill="#FF6B35"/>
  <text x="64" y="398" font-size="24" font-weight="700" fill="#E8E2D4" text-anchor="start">Workflow</text>
  <text x="248" y="398" font-size="20" font-weight="600" fill="#E8E2D4" text-anchor="start">ETL / Data modeling / KPI reporting</text>
  <text x="680" y="398" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start">Raw data → clean model → validated dashboard, with the</text>
<text x="680" y="419" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start">metric defined first.</text>
</g>
<line x1="64" y1="470" x2="1136" y2="470" stroke="#E8E2D4" stroke-opacity="0.16" stroke-width="1"/>
<text x="64" y="496" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start">Primary stack: SQL and Power BI. Python for cleaning and EDA; Tableau and Excel for reporting.</text>

</svg>
