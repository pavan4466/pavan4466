  <text x="64" y="398" font-size="24" font-weight="700" fill="#E8E2D4" text-anchor="start" class="slide">Workflow</text>
  <text x="248" y="398" font-size="20" font-weight="600" fill="#E8E2D4" text-anchor="start" class="slide">ETL / Data modeling / KPI reporting</text>
  <text x="680" y="398" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start" class="slide">Raw data → clean model → validated dashboard, with the</text>
<text x="680" y="419" font-size="15" font-weight="400" fill="#9FB0BE" text-anchor="start" class="slide">metric defined first.</text>
