<text x="680" y="124" font-size="11.5" font-weight="400" fill="#9FB0BE" text-anchor="start" letter-spacing="1" class="slide">WHERE I USE IT</text>
<line x1="216" y1="150" x2="216" y2="588" stroke="#E8E2D4" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="438" stroke-dashoffset="438" style="animation-delay: 0.4s;" class="draw"/>
