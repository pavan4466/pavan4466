<title id="sheet-title">Smartphone Market Analysis — project 01</title>
<desc id="sheet-desc">Smartphone Market Analysis. Understand what actually drives smartphone prices on Flipkart. Scraped and analyzed 400+ smartphone listings. Explored price, rating, discount, and specification patterns. Modeled how RAM and storage relate to listed price. Stack: Python, pandas, BeautifulSoup4, NumPy, Matplotlib, Seaborn.</desc>
