<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="sheet-title sheet-desc">
<title id="sheet-title">World Energy Consumption — project 03</title>
<desc id="sheet-desc">World Energy Consumption. Relate energy use, emissions, GDP, and population across countries. Designed a relational MySQL schema for country-level analysis. Used joins, aggregations, subqueries, and per-capita calculations. Compared economic scale and fossil-fuel dependence against emissions. Stack: SQL, MySQL, Relational modeling.</desc>
